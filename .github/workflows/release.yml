name: release
# Merge into develop = beta, merge into main = stable. Fully automatic once the checks pass; see docs/RELEASING.md.
# The version is computed from the existing v* tags (scripts/release/release.ts version), never committed.
on:
  push:
    branches: [main, develop]

permissions:
  contents: read

# One release at a time per branch, so two merges never compute the same version. GitHub keeps one waiting run per
# group and a newer one replaces it: per branch, a develop merge never drops a waiting stable release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  version:
    needs: checks
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Prints channel=... and version=... (empty when this commit already has its release).
      - id: version
        run: node --no-warnings scripts/release/release.ts version --branch "$GITHUB_REF_NAME" --sha "$GITHUB_SHA" | tee -a "$GITHUB_OUTPUT"

  # The Linux builds gate the release: publish waits only for these two.
  build:
    needs: version
    if: needs.version.outputs.version != ''
    strategy:
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-24.04
          - target: linux-arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ARCHIVE: release/shub-${{ needs.version.outputs.version }}-${{ matrix.target }}.tar.gz
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-archive
        with:
          target: ${{ matrix.target }}

  # The two macOS builds never delay the release: GitHub's macOS runners are scarce (a job can wait 15+ minutes for one,
  # or be given up with "not acquired by Runner", 2026-11-18 beta.69). publish-mac adds whatever finished to the
  # already published release; until then the updater on that Mac reports "no build for this platform"
  # (launcher/src/update.ts), and a failed build means it gets the next release.
  build-mac:
    needs: version
    if: needs.version.outputs.version != ''
    strategy:
      matrix:
        include:
          - target: darwin-arm64
            os: macos-15
          - target: darwin-x64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ARCHIVE: release/shub-${{ needs.version.outputs.version }}-${{ matrix.target }}.tar.gz
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-archive
        with:
          target: ${{ matrix.target }}

  publish:
    needs: [version, build]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CHANNEL: ${{ needs.version.outputs.channel }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: archive-*
          path: release
          merge-multiple: true
      # The key stays in this environment variable; sign refuses a key whose public half is not in
      # launcher/release-keys.pem.
      - name: Sign SHA256SUMS
        env:
          SHUB_RELEASE_SIGNING_KEY: ${{ secrets.SHUB_RELEASE_SIGNING_KEY }}
        run: node --no-warnings scripts/release/release.ts sign release
      - name: Release notes
        run: node --no-warnings scripts/release/release.ts changelog --channel "$CHANNEL" --sha "$GITHUB_SHA" > notes.md
      # Creates the tag v$VERSION on this commit; tags are never moved or deleted.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [ "$CHANNEL" = beta ]; then prerelease="--prerelease"; fi
          gh release create "v$VERSION" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "shub $VERSION" --notes-file notes.md $prerelease
      # Running installs listen on this ntfy topic and check for updates at once (server/updates); best effort.
      - name: Notify installs
        run: curl -fsS -m 10 -d "$VERSION" https://ntfy.sh/christoph-teichmeister-shub-releases || true

  # Adds the Mac archives to the published release and signs SHA256SUMS again over all of them (one upload, so the
  # sums and their signature change together). Nothing to do when no Mac build finished.
  publish-mac:
    needs: [version, publish, build-mac]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: archive-*
          path: release
          merge-multiple: true
      - name: Sign SHA256SUMS over everything
        id: sign
        env:
          SHUB_RELEASE_SIGNING_KEY: ${{ secrets.SHUB_RELEASE_SIGNING_KEY }}
        run: |
          if ! ls release/*darwin*.tar.gz >/dev/null 2>&1; then echo "no Mac archive, nothing to add"; exit 0; fi
          node --no-warnings scripts/release/release.ts sign release
          echo "added=true" >> "$GITHUB_OUTPUT"
      - name: Upload
        if: steps.sign.outputs.added == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v$VERSION" release/*darwin* release/SHA256SUMS release/SHA256SUMS.sig --clobber --repo "$GITHUB_REPOSITORY"
      - name: Notify installs
        if: steps.sign.outputs.added == 'true'
        run: curl -fsS -m 10 -d "$VERSION" https://ntfy.sh/christoph-teichmeister-shub-releases || true
